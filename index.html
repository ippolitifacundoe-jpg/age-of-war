<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Age of War - Versión Original 1.4</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #1a1a1a; color: white; display: flex; flex-direction: column; align-items: center; padding: 10px; margin: 0; }
        #muro { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; width: 98%; padding-bottom: 220px; margin-top: 20px; }
        .carta { background: #fdfdfd; color: #111; padding: 8px; border-radius: 8px; border: 4px solid #888; cursor: pointer; transition: 0.2s; position: relative; min-height: 190px; box-shadow: 0 4px 8px rgba(0,0,0,0.5); }
        .carta.seleccionada { border-color: #f1c40f; box-shadow: 0 0 20px #f1c40f; transform: translateY(-5px); z-index: 10; }
        .carta.inexpugnable { background: #333; color: #bdc3c7; border-color: #27ae60; cursor: default; }
        .clan-label { font-size: 0.65rem; font-weight: bold; text-transform: uppercase; margin-bottom: 3px; }
        .linea { border: 1px solid #ccc; margin: 3px 0; padding: 3px; border-radius: 4px; background: white; font-weight: bold; font-size: 0.85rem; text-align: center; }
        .linea.hecha { background: #27ae60; color: white; text-decoration: line-through; }
        .linea.resaltada { border: 2px solid #2ecc71; background: #d5f5e3; animation: glow 0.8s infinite alternate; cursor: pointer; }
        
        .panel-inferior { position: fixed; bottom: 0; width: 100%; background: #222; border-top: 5px solid #f1c40f; padding: 15px; display: flex; justify-content: space-around; align-items: center; z-index: 100; }
        .bandeja-dados { display: flex; gap: 8px; min-width: 380px; justify-content: center; background: #333; padding: 12px; border-radius: 10px; border: 1px solid #444; }
        .dado { width: 50px; height: 50px; background: white; color: black; display: flex; align-items: center; justify-content: center; border-radius: 8px; font-size: 1.4rem; font-weight: bold; border: 3px solid #000; }
        
        .stats { position: fixed; top: 10px; right: 20px; background: rgba(0,0,0,0.9); padding: 12px; border: 2px solid #f1c40f; border-radius: 12px; z-index: 1000; }
        button { padding: 12px 25px; font-size: 1rem; cursor: pointer; border-radius: 6px; border: none; background: #e67e22; color: white; font-weight: bold; }
        button:disabled { background: #444; color: #777; cursor: not-allowed; }
        @keyframes glow { from { box-shadow: 0 0 5px #2ecc71; } to { box-shadow: 0 0 15px #2ecc71; } }
    </style>
</head>
<body>

    <div class="stats">
        <div style="color:#f1c40f; font-size: 1.1rem;">PUNTOS: <span id="puntos-val">0</span></div>
        <div id="clanes-lista" style="font-size: 0.7rem; color: #2ecc71; margin-top: 4px;"></div>
    </div>

    <h2 style="margin: 5px; color: #f1c40f;">Age of War: Distribución Oficial</h2>
    <p id="feedback" style="font-size: 0.9rem;">Haz clic en un castillo para asaltarlo.</p>

    <div id="muro"></div>

    <div class="panel-inferior">
        <div id="info-dados" style="font-size: 1.1rem; color: #f1c40f;">Dados: 7</div>
        <div class="bandeja-dados" id="bandeja"></div>
        <div>
            <button id="btn-lanzar" onclick="lanzar()" disabled>LANZAR ATAQUE</button>
            <button id="btn-fallo" onclick="penalizar()" style="display:none; background:#c0392b;">FALLO (PERDER DADO)</button>
        </div>
    </div>

    <script>
        // CONFIGURACIÓN OFICIAL SEGÚN TU PEDIDO Y LAS FUENTES [1, 5, 6]
        const castillos = [
            // Clan Oda (3) - Color Naranja
            { id: 0, clan: "Oda", nombre: "Kiyosu", color: "#d35400", lineas: ["🐎", "⚔️3"], pts: 2, unif: 18 },
            { id: 1, clan: "Oda", nombre: "Inabayama", color: "#d35400", lineas: ["🏹", "⚔️1"], pts: 1, unif: 18 },
            { id: 2, clan: "Oda", nombre: "Azuchi", color: "#d35400", lineas: ["🐎🐎", "⚔️5"], pts: 3, unif: 18 },
            // Clan Tokugawa (3) - Color Negro/Gris
            { id: 3, clan: "Tokugawa", nombre: "Okazaki", color: "#333", lineas: ["⚔️7", "🏹"], pts: 2, unif: 18 },
            { id: 4, clan: "Tokugawa", nombre: "Hamamatsu", color: "#333", lineas: ["🏹🏹"], pts: 1, unif: 18 },
            { id: 5, clan: "Tokugawa", nombre: "Edo", color: "#333", lineas: ["⚔️3", "🏹", "🐎"], pts: 3, unif: 18 },
            // Clan Shimazu (2) - Color Verde
            { id: 6, clan: "Shimazu", nombre: "Uchijo", color: "#27ae60", lineas: ["🏹", "⚔️5", "⚔️2"], pts: 2, unif: 7 },
            { id: 7, clan: "Shimazu", nombre: "Kagoshima", color: "#27ae60", lineas: ["⚔️4"], pts: 3, unif: 7 },
            // Clan Chosokabe (2) - Color Azul
            { id: 8, clan: "Chosokabe", nombre: "Oko", color: "#3498db", lineas: ["🐎"], pts: 1, unif: 5 },
            { id: 9, clan: "Chosokabe", nombre: "Urado", color: "#⚔️4", color: "#3498db", lineas: ["⚔️4", "⚔️4"], pts: 2, unif: 5 },
            // Clan Mori (2) - Color Rojo
            { id: 10, clan: "Mori", nombre: "Yoshida-Koriyama", color: "#e74c3c", lineas: ["🏹", "⚔️5", "⚔️2"], pts: 2, unif: 10 },
            { id: 11, clan: "Mori", nombre: "Gassan-Toda", color: "#e74c3c", lineas: ["⚔️8"], pts: 2, unif: 10 },
            // Clan Uesugi (2) - Color Púrpura
            { id: 12, clan: "Uesugi", nombre: "Kasugayama", color: "#8e44ad", lineas: ["🏹🏹", "🐎🐎"], pts: 4, unif: 12 },
            { id: 13, clan: "Uesugi", nombre: "Otate", color: "#8e44ad", lineas: ["🏹🏹", "🐎", "⚔️6"], pts: 3, unif: 12 }
        ];

        let dadosMano = 7, dadosEnCarta = 0, idSel = null, conquistados = [], clanesLlenos = [], tirada = [];

        function render() {
            const container = document.getElementById('muro'); container.innerHTML = '';
            castillos.forEach(c => {
                const esUnif = clanesLlenos.includes(c.clan);
                const div = document.createElement('div');
                div.className = `carta ${esUnif ? 'inexpugnable' : ''} ${idSel === c.id ? 'seleccionada' : ''}`;
                div.style.borderColor = c.color;
                div.innerHTML = `<div class="clan-label" style="color:${c.color}">${c.clan}</div>
                                 <strong style="font-size:0.9rem">${c.nombre}</strong><div id="lines-${c.id}"></div>
                                 <div style="position:absolute; bottom:8px; left:8px; font-weight:bold;">PTS: ${c.pts}</div>`;
                c.lineas.forEach((l, i) => {
                    const lDiv = document.createElement('div'); lDiv.className = 'linea';
                    lDiv.id = `l-${c.id}-${i}`; lDiv.innerText = l;
                    div.querySelector(`#lines-${c.id}`).appendChild(lDiv);
                });
                if (!esUnif && !conquistados.includes(c.id)) div.onclick = () => select(c.id);
                container.appendChild(div);
            });
            updateStats();
        }

        function select(id) { if (dadosEnCarta > 0) return; idSel = id; document.getElementById('btn-lanzar').disabled = false; render(); }

        function lanzar() {
            const num = dadosMano - dadosEnCarta; tirada = [];
            const tray = document.getElementById('bandeja'); tray.innerHTML = '';
            const caras = ["⚔️1", "⚔️2", "⚔️3", "🏹", "🐎", "👺"];
            for(let i=0; i<num; i++) {
                const r = caras[Math.floor(Math.random()*6)];
                tirada.push({ val: r.includes('⚔️') ? parseInt(r.replace('⚔️','')) : 1, tipo: r.includes('⚔️') ? 'inf' : r, txt: r });
                tray.innerHTML += `<div class="dado">${r}</div>`;
            }
            validar();
        }

        function validar() {
            const c = castillos[idSel]; let hayAlgo = false;
            document.getElementById('btn-lanzar').disabled = true;
            document.getElementById('btn-fallo').style.display = 'inline-block';

            c.lineas.forEach((l, i) => {
                const el = document.getElementById(`l-${idSel}-${i}`);
                if (el.classList.contains('hecha')) return;
                let ok = false;
                if (l.includes('⚔️')) {
                    const req = parseInt(l.replace('⚔️',''));
                    const sum = tirada.filter(d => d.tipo === 'inf').reduce((a,b) => a + b.val, 0);
                    if (sum >= req) ok = true;
                } else {
                    const reqSyms = [...l]; const disp = tirada.map(d => d.txt);
                    ok = reqSyms.every(s => { const idx = disp.indexOf(s); if (idx > -1) { disp.splice(idx, 1); return true; } return false; });
                }
                if (ok) { el.classList.add('resaltada'); el.onclick = () => ocupar(i, l); hayAlgo = true; }
            });

            if (!hayAlgo) {
                document.getElementById('feedback').innerText = "Fallo. Perderás 1 dado.";
                checkImposibilidad(true); // Detecta derrota tras fallo
            } else {
                document.getElementById('feedback').innerText = "¡Tropas listas! Elige una línea.";
            }
        }

        function checkImposibilidad(trasFallo) {
            const dadosRestantes = (dadosMano - (trasFallo ? 1 : 0)) - dadosEnCarta;
            const lineasPendientes = Array.from(document.querySelectorAll(`#lines-${idSel} .linea:not(.hecha)`));
            let minDadosReq = 0;
            lineasPendientes.forEach(el => {
                const t = el.innerText;
                if (t.includes('⚔️')) minDadosReq += Math.ceil(parseInt(t.replace('⚔️','')) / 3);
                else minDadosReq += [...t].length;
            });

            if (dadosRestantes < minDadosReq) {
                alert(`DERROTA INEVITABLE: Necesitas ${minDadosReq} dados pero solo te quedarían ${dadosRestantes}. Turno perdido.`);
                reset();
            }
        }

        function ocupar(idx, txt) {
            let usados = 0;
            if (txt.includes('⚔️')) {
                const req = parseInt(txt.replace('⚔️',''));
                const kats = tirada.filter(d => d.tipo === 'inf').sort((a,b) => b.val - a.val);
                let suma = 0; for(let k of kats) { suma += k.val; usados++; if (suma >= req) break; }
            } else usados = [...txt].length;

            dadosEnCarta += usados;
            const el = document.getElementById(`l-${idSel}-${idx}`);
            el.classList.replace('resaltada', 'hecha'); el.onclick = null;
            document.querySelectorAll('.linea.resaltada').forEach(e => { e.classList.remove('resaltada'); e.onclick = null; });

            if (document.querySelectorAll(`#lines-${idSel} .linea:not(.hecha)`).length === 0) {
                alert("¡CASTILLO CONQUISTADO!"); conquistados.push(idSel); checkClanes(); reset();
            } else {
                document.getElementById('btn-lanzar').disabled = false;
                document.getElementById('btn-fallo').style.display = 'none';
                checkImposibilidad(false); // Detecta derrota tras ocupar
            }
            updateStats();
        }

        function penalizar() {
            dadosMano--; if (dadosMano <= dadosEnCarta) { alert("Sin tropas. Fin del asalto."); reset(); }
            else lanzar();
            updateStats();
        }

        function checkClanes() {
            ["Oda", "Tokugawa", "Shimazu", "Chosokabe", "Mori", "Uesugi"].forEach(clan => {
                const ids = castillos.filter(c => c.clan === clan).map(c => c.id);
                if (ids.every(id => conquistados.includes(id)) && !clanesLlenos.includes(clan)) {
                    clanesLlenos.push(clan); alert(`¡CLAN ${clan.toUpperCase()} UNIFICADO!`);
                }
            });
        }

        function reset() {
            dadosMano = 7; dadosEnCarta = 0; idSel = null; tirada = [];
            document.getElementById('btn-lanzar').disabled = true;
            document.getElementById('btn-fallo').style.display = 'none';
            document.getElementById('bandeja').innerHTML = ''; render();
        }

        function updateStats() {
            document.getElementById('info-dados').innerText = `Tropas: ${dadosMano - dadosEnCarta}`;
            let total = 0; const clansVistos = [];
            castillos.forEach(c => {
                if (conquistados.includes(c.id)) {
                    if (clanesLlenos.includes(c.clan)) {
                        if (!clansVistos.includes(c.clan)) { total += c.unif; clansVistos.push(c.clan); }
                    } else total += c.pts;
                }
            });
            document.getElementById('puntos-val').innerText = total;
            document.getElementById('clanes-lista').innerText = clanesLlenos.join(", ");
        }

        render();
    </script>
</body>
</html>
