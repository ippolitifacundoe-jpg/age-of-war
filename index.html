<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Age of War - Versión Final 1.2</title>
    <style>
        body { font-family: 'Arial', sans-serif; background: #121212; color: white; display: flex; flex-direction: column; align-items: center; padding: 20px; margin: 0; }
        #muro { display: grid; grid-template-columns: repeat(5, 1fr); gap: 15px; width: 90%; margin-top: 20px; padding-bottom: 200px; }
        .carta { background: #eee; color: #111; padding: 10px; border-radius: 8px; border: 4px solid #888; cursor: pointer; transition: 0.2s; position: relative; min-height: 140px; }
        .carta.seleccionada { border-color: #f1c40f; box-shadow: 0 0 20px #f1c40f; transform: scale(1.02); }
        .carta.inexpugnable { background: #333; color: #999; border-color: #27ae60; cursor: default; }
        .clan-label { font-size: 0.7rem; font-weight: bold; text-transform: uppercase; }
        .linea { border: 1px solid #ccc; margin: 4px 0; padding: 3px; border-radius: 4px; background: white; font-weight: bold; font-size: 0.8rem; text-align: center; }
        .linea.hecha { background: #27ae60; color: white; text-decoration: line-through; border-color: #1e8449; }
        .linea.resaltada { border: 2px solid #2ecc71; background: #d5f5e3; animation: glow 1s infinite alternate; cursor: pointer; }
        
        .panel-inferior { position: fixed; bottom: 0; width: 100%; background: #222; border-top: 4px solid #f1c40f; padding: 20px; display: flex; justify-content: space-around; align-items: center; z-index: 100; }
        .bandeja-dados { display: flex; gap: 10px; min-width: 350px; justify-content: center; background: #333; padding: 15px; border-radius: 10px; }
        .dado { width: 50px; height: 50px; background: white; color: black; display: flex; align-items: center; justify-content: center; border-radius: 8px; font-size: 1.4rem; font-weight: bold; border: 2px solid #000; box-shadow: 2px 2px 5px rgba(0,0,0,0.5); }
        
        .marcador { position: fixed; top: 10px; right: 20px; background: rgba(0,0,0,0.8); padding: 15px; border: 1px solid #f1c40f; border-radius: 10px; }
        button { padding: 12px 20px; font-size: 1rem; cursor: pointer; border-radius: 5px; border: none; background: #e67e22; color: white; font-weight: bold; }
        button:disabled { background: #444; color: #777; cursor: not-allowed; }
        @keyframes glow { from { box-shadow: 0 0 5px #2ecc71; } to { box-shadow: 0 0 15px #2ecc71; } }
    </style>
</head>
<body>

    <div class="marcador">
        <div style="color:#f1c40f; font-size: 1.2rem;">PUNTOS: <span id="puntos-val">0</span></div>
        <div id="clanes-lista" style="font-size: 0.7rem; color: #2ecc71; margin-top: 5px;"></div>
    </div>

    <h1>Age of War - Digital</h1>
    <p id="feedback">Selecciona un castillo para empezar el asalto.</p>

    <div id="muro"></div>

    <div class="panel-inferior">
        <div id="info-dados">Dados: 7</div>
        <div class="bandeja-dados" id="bandeja"></div>
        <div>
            <button id="btn-lanzar" onclick="lanzar()" disabled>Lanzar Dados</button>
            <button id="btn-fallo" onclick="penalizar()" style="display:none; background:#c0392b;">Fallo (Perder 1 dado)</button>
        </div>
    </div>

    <script>
        // Datos exactos de los 14 castillos originales
        const castillos = [
            { id: 0, clan: "Mori", nombre: "Takahashi", color: "#e74c3c", lineas: ["🏹", "⚔️5"], pts: 1, unif: 10 },
            { id: 1, clan: "Mori", nombre: "Hiroshima", color: "#e74c3c", lineas: ["🐎", "⚔️6"], pts: 2, unif: 10 },
            { id: 2, clan: "Mori", nombre: "Gassantoda", color: "#e74c3c", lineas: ["👺", "🏹", "⚔️8"], pts: 3, unif: 10 },
            { id: 3, clan: "Uesugi", nombre: "Kitanosho", color: "#8e44ad", lineas: ["🏹", "🐎", "⚔️6"], pts: 3, unif: 12 },
            { id: 4, clan: "Uesugi", nombre: "Kasugayama", color: "#8e44ad", lineas: ["👺", "🐎", "⚔️8"], pts: 5, unif: 12 },
            { id: 5, clan: "Chosokabe", nombre: "Matsuyama", color: "#3498db", lineas: ["🏹", "⚔️4"], pts: 1, unif: 5 },
            { id: 6, clan: "Chosokabe", nombre: "Marugame", color: "#3498db", lineas: ["🐎", "⚔️5"], pts: 2, unif: 5 },
            { id: 7, clan: "Shimazu", nombre: "Kagoshima", color: "#27ae60", lineas: ["🏹", "⚔️6"], pts: 2, unif: 7 },
            { id: 8, clan: "Shimazu", nombre: "Kumamoto", color: "#27ae60", lineas: ["👺", "⚔️8"], pts: 3, unif: 7 },
            { id: 9, clan: "Tokugawa", nombre: "Okazaki", color: "#f1c40f", lineas: ["🐎", "⚔️5"], pts: 2, unif: 8 },
            { id: 10, clan: "Tokugawa", nombre: "Edo", color: "#f1c40f", lineas: ["👺", "⚔️7"], pts: 3, unif: 8 },
            { id: 11, clan: "Oda", nombre: "Gifu", color: "#d35400", lineas: ["🏹", "⚔️6"], pts: 2, unif: 18 },
            { id: 12, clan: "Oda", nombre: "Matsumoto", color: "#d35400", lineas: ["🐎", "⚔️7"], pts: 4, unif: 18 },
            { id: 13, clan: "Oda", nombre: "Azuchi", color: "#d35400", lineas: ["👺", "⚔️9"], pts: 6, unif: 18 }
        ];

        let dadosMano = 7;
        let dadosEnCarta = 0;
        let idSeleccionado = null;
        let conquistados = [];
        let clanesLlenos = [];
        let tirada = [];

        function render() {
            const container = document.getElementById('muro');
            container.innerHTML = '';
            castillos.forEach(c => {
                const esUnif = clanesLlenos.includes(c.clan);
                const div = document.createElement('div');
                div.className = `carta ${esUnif ? 'inexpugnable' : ''} ${idSeleccionado === c.id ? 'seleccionada' : ''}`;
                div.style.borderColor = c.color;
                div.innerHTML = `<div class="clan-label" style="color:${c.color}">${c.clan}</div>
                                 <strong>${c.nombre}</strong><div id="lines-${c.id}"></div>
                                 <div style="margin-top:10px">PTS: ${c.pts}</div>`;
                
                const linesDiv = div.querySelector(`#lines-${c.id}`);
                c.lineas.forEach((l, i) => {
                    const lDiv = document.createElement('div');
                    lDiv.className = 'linea';
                    lDiv.id = `l-${c.id}-${i}`;
                    lDiv.innerText = l;
                    linesDiv.appendChild(lDiv);
                });

                if (!esUnif && !conquistados.includes(c.id)) div.onclick = () => select(c.id);
                container.appendChild(div);
            });
            updateStats();
        }

        function select(id) {
            if (dadosEnCarta > 0) return; // No cambiar a mitad de ataque
            idSeleccionado = id;
            document.getElementById('btn-lanzar').disabled = false;
            document.getElementById('feedback').innerText = `Atacando ${castillos[id].nombre}. ¡Lanza!`;
            render();
        }

        function lanzar() {
            const num = dadosMano - dadosEnCarta;
            const caras = ["⚔️1", "⚔️2", "⚔️3", "🏹", "🐎", "👺"];
            tirada = [];
            const tray = document.getElementById('bandeja');
            tray.innerHTML = '';
            for(let i=0; i<num; i++) {
                const r = caras[Math.floor(Math.random()*6)];
                tirada.push({ val: r.includes('⚔️') ? parseInt(r.replace('⚔️','')) : 1, tipo: r.includes('⚔️') ? 'inf' : r, txt: r });
                tray.innerHTML += `<div class="dado">${r}</div>`;
            }
            validar();
        }

        function validar() {
            const c = castillos[idSeleccionado];
            let hayAlgo = false;
            document.getElementById('btn-lanzar').disabled = true;
            document.getElementById('btn-fallo').style.display = 'inline-block';

            c.lineas.forEach((l, i) => {
                const el = document.getElementById(`l-${idSeleccionado}-${i}`);
                if (el.classList.contains('hecha')) return;
                let ok = false;
                if (l.includes('⚔️')) {
                    const req = parseInt(l.replace('⚔️',''));
                    const sum = tirada.filter(d => d.tipo === 'inf').reduce((a,b) => a + b.val, 0);
                    if (sum >= req) ok = true;
                } else if (tirada.some(d => d.txt === l)) ok = true;

                if (ok) {
                    el.classList.add('resaltada');
                    el.onclick = () => ocupar(i, l);
                    hayAlgo = true;
                }
            });
            document.getElementById('feedback').innerText = hayAlgo ? "¡Coincidencia! Elige una línea." : "Nada coincide. Pierde 1 dado.";
        }

        function ocupar(idx, txt) {
            // LÓGICA SOLICITADA: DESCONTAR EL MÍNIMO DE DADOS
            let usados = 0;
            if (txt.includes('⚔️')) {
                const req = parseInt(txt.replace('⚔️',''));
                // Ordenamos de mayor a menor para usar la MENOR cantidad de dados posibles
                const kats = tirada.filter(d => d.tipo === 'inf').sort((a,b) => b.val - a.val);
                let sumaActual = 0;
                for(let k of kats) {
                    sumaActual += k.val;
                    usados++;
                    if (sumaActual >= req) break;
                }
            } else usados = 1;

            dadosEnCarta += usados;
            const el = document.getElementById(`l-${idSeleccionado}-${idx}`);
            el.classList.replace('resaltada', 'hecha');
            el.onclick = null;
            document.querySelectorAll('.linea.resaltada').forEach(e => { e.classList.remove('resaltada'); e.onclick = null; });

            if (document.querySelectorAll(`#lines-${idSeleccionado} .linea:not(.hecha)`).length === 0) {
                alert(`¡Castillo conquistado!`);
                conquistados.push(idSeleccionado);
                checkClanes();
                reset();
            } else {
                document.getElementById('btn-lanzar').disabled = false;
                document.getElementById('btn-fallo').style.display = 'none';
            }
            updateStats();
        }

        function penalizar() {
            dadosMano--;
            if (dadosMano <= dadosEnCarta) { alert("¡Derrota! Sin tropas."); reset(); }
            else lanzar();
            updateStats();
        }

        function checkClanes() {
            ["Mori", "Uesugi", "Chosokabe", "Shimazu", "Tokugawa", "Oda"].forEach(clan => {
                const ids = castillos.filter(c => c.clan === clan).map(c => c.id);
                if (ids.every(id => conquistados.includes(id)) && !clanesLlenos.includes(clan)) {
                    clanesLlenos.push(clan);
                    alert(`¡Clan ${clan} unificado!`);
                }
            });
        }

        function reset() {
            dadosMano = 7; dadosEnCarta = 0; idSeleccionado = null;
            document.getElementById('btn-lanzar').disabled = true;
            document.getElementById('btn-fallo').style.display = 'none';
            document.getElementById('bandeja').innerHTML = '';
            render();
        }

        function updateStats() {
            document.getElementById('info-dados').innerText = `Tropas: ${dadosMano - dadosEnCarta}`;
            let total = 0;
            const clansVistos = [];
            castillos.forEach(c => {
                if (conquistados.includes(c.id)) {
                    if (clanesLlenos.includes(c.clan)) {
                        if (!clansVistos.includes(c.clan)) { total += c.unif; clansVistos.push(c.clan); }
                    } else total += c.pts;
                }
            });
            document.getElementById('puntos-val').innerText = total;
            document.getElementById('clanes-lista').innerText = clanesLlenos.join(", ");
        }

        render(); // ESTO INICIA EL JUEGO AL CARGAR
    </script>
</body>
</html>
