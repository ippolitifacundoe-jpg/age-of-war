<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Age of War - Versión Original 1.1</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #1a1a1a; color: white; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .muro { display: grid; grid-template-columns: repeat(5, 1fr); gap: 15px; width: 90%; margin-bottom: 20px; }
        .carta { background: #f4f4f4; color: #333; padding: 12px; border-radius: 10px; border: 5px solid #ccc; cursor: pointer; transition: 0.2s; position: relative; min-height: 160px; }
        .carta.seleccionada { border-color: #f1c40f; box-shadow: 0 0 20px #f1c40f; transform: translateY(-5px); z-index: 5; }
        .carta.inexpugnable { background: #2c3e50; color: #bdc3c7; border-color: #27ae60; cursor: default; opacity: 0.8; }
        .clan-tag { font-size: 0.7rem; font-weight: bold; text-transform: uppercase; margin-bottom: 5px; }
        .linea { border: 1px solid #ccc; margin: 4px 0; padding: 3px; border-radius: 4px; background: white; font-weight: bold; font-size: 0.9rem; }
        .linea.hecha { background: #27ae60; color: white; text-decoration: line-through; }
        .linea.disponible { border: 2px solid #2ecc71; background: #e8f8f5; animation: blink 1s infinite; }
        
        .panel-control { background: #2c3e50; width: 100%; padding: 20px; position: fixed; bottom: 0; display: flex; justify-content: space-around; align-items: center; border-top: 4px solid #f1c40f; z-index: 100; }
        .bandeja { display: flex; gap: 10px; min-width: 400px; justify-content: center; }
        .dado { width: 55px; height: 55px; background: white; color: black; display: flex; align-items: center; justify-content: center; border-radius: 8px; font-size: 1.5rem; border: 3px solid #333; box-shadow: 2px 2px 5px rgba(0,0,0,0.3); }
        .stats { position: fixed; top: 10px; right: 20px; background: rgba(0,0,0,0.8); padding: 15px; border-radius: 10px; border: 1px solid #f1c40f; }
        button { padding: 12px 25px; font-size: 1.1rem; cursor: pointer; border-radius: 8px; border: none; background: #e67e22; color: white; font-weight: bold; }
        button:disabled { background: #7f8c8d; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
    </style>
</head>
<body>

    <div class="stats">
        <div style="color:#f1c40f; font-weight:bold;">PUNTUACIÓN: <span id="puntos">0</span></div>
        <div id="clanes-unificados" style="font-size: 0.8rem; color: #2ecc71; margin-top:5px;"></div>
    </div>

    <h1>Age of War: Unificación del Japón</h1>
    <p id="msg">Selecciona un castillo neutral para iniciar el asalto.</p>

    <div class="muro" id="muro"></div>

    <div class="panel-control">
        <div id="dados-contar">Tropas: 7</div>
        <div class="bandeja" id="bandeja"></div>
        <div>
            <button id="btn-lanzar" onclick="lanzarDados()" disabled>Lanzar Dados</button>
            <button id="btn-fallo" onclick="penalizar()" style="display:none; background:#c0392b;">Fallo (Retirar 1 dado)</button>
        </div>
    </div>

    <script>
        // DATOS ORIGINALES DE LAS 14 CARTAS [3, 5, 6]
        const castillosOriginales = [
            { id: 0, clan: "Mori", nombre: "Takahashi", color: "#e74c3c", lineas: ["🏹", "⚔️5"], pts: 1, unific: 10 },
            { id: 1, clan: "Mori", nombre: "Hiroshima", color: "#e74c3c", lineas: ["🐎", "⚔️6"], pts: 2, unific: 10 },
            { id: 2, clan: "Mori", nombre: "Gassantoda", color: "#e74c3c", lineas: ["👺", "🏹", "⚔️8"], pts: 3, unific: 10 },
            { id: 3, clan: "Uesugi", nombre: "Kitanosho", color: "#8e44ad", lineas: ["🏹", "🐎", "⚔️6"], pts: 3, unific: 12 },
            { id: 4, clan: "Uesugi", nombre: "Kasugayama", color: "#8e44ad", lineas: ["👺", "🐎", "⚔️8"], pts: 5, unific: 12 },
            { id: 5, clan: "Chosokabe", nombre: "Matsuyama", color: "#3498db", lineas: ["🏹", "⚔️4"], pts: 1, unific: 5 },
            { id: 6, clan: "Chosokabe", nombre: "Marugame", color: "#3498db", lineas: ["🐎", "⚔️5"], pts: 2, unific: 5 },
            { id: 7, clan: "Shimazu", nombre: "Kagoshima", color: "#27ae60", lineas: ["🏹", "⚔️6"], pts: 2, unific: 7 },
            { id: 8, clan: "Shimazu", nombre: "Kumamoto", color: "#27ae60", lineas: ["👺", "⚔️8"], pts: 3, unific: 7 },
            { id: 9, clan: "Tokugawa", nombre: "Okazaki", color: "#f1c40f", lineas: ["🐎", "⚔️5"], pts: 2, unific: 8 },
            { id: 10, clan: "Tokugawa", nombre: "Edo", color: "#f1c40f", lineas: ["👺", "⚔️7"], pts: 3, unific: 8 },
            { id: 11, clan: "Oda", nombre: "Gifu", color: "#d35400", lineas: ["🏹", "⚔️6"], pts: 2, unific: 18 },
            { id: 12, clan: "Oda", nombre: "Matsumoto", color: "#d35400", lineas: ["🐎", "⚔️7"], pts: 4, unific: 18 },
            { id: 13, clan: "Oda", nombre: "Azuchi", color: "#d35400", lineas: ["👺", "⚔️9"], pts: 6, unific: 18 }
        ];

        let dadosEnMano = 7;
        let dadosBloqueados = 0;
        let castilloObjetivo = null;
        let conquistados = [];
        let clanesCompletos = [];
        let resultados = [];

        function renderMuro() {
            const muro = document.getElementById('muro');
            muro.innerHTML = '';
            castillosOriginales.forEach(c => {
                const div = document.createElement('div');
                const esUnificado = clanesCompletos.includes(c.clan);
                div.className = `carta ${esUnificado ? 'inexpugnable' : ''} ${castilloObjetivo === c.id ? 'seleccionada' : ''}`;
                div.style.borderColor = c.color;
                
                div.innerHTML = `<div class="clan-tag" style="color:${c.color}">${c.clan}</div>
                                 <strong style="font-size:1.1rem">${c.nombre}</strong><br>
                                 <div id="lineas-${c.id}"></div>
                                 <div style="position:absolute; bottom:10px; left:12px; font-weight:bold">PTS: ${c.pts}</div>`;
                
                const lineasDiv = div.querySelector(`#lineas-${c.id}`);
                c.lineas.forEach((l, idx) => {
                    const lDiv = document.createElement('div');
                    lDiv.className = 'linea';
                    lDiv.id = `l-${c.id}-${idx}`;
                    lDiv.innerText = l;
                    lineasDiv.appendChild(lDiv);
                });

                if (!esUnificado && !conquistados.includes(c.id)) {
                    div.onclick = () => seleccionarCastillo(c.id);
                }
                muro.appendChild(div);
            });
            actualizarUI();
        }

        function seleccionarCastillo(id) {
            if (dadosBloqueados > 0) return; // No cambiar durante ataque
            castilloObjetivo = id;
            document.getElementById('btn-lanzar').disabled = false;
            document.getElementById('msg').innerText = `Asaltando ${castillosOriginales[id].nombre}. ¡Lanza tus tropas!`;
            renderMuro();
        }

        function lanzarDados() {
            const num = dadosEnMano - dadosBloqueados;
            const caras = ["⚔️1", "⚔️2", "⚔️3", "🏹", "🐎", "👺"];
            resultados = [];
            const bandeja = document.getElementById('bandeja');
            bandeja.innerHTML = '';
            
            for(let i=0; i<num; i++){
                const r = caras[Math.floor(Math.random()*6)];
                resultados.push({
                    val: r.includes('⚔️') ? parseInt(r.replace('⚔️','')) : 1,
                    tipo: r.includes('⚔️') ? 'inf' : r,
                    txt: r
                });
                bandeja.innerHTML += `<div class="dado">${r}</div>`;
            }
            validarMovimientos();
        }

        function validarMovimientos() {
            const card = castillosOriginales[castilloObjetivo];
            let hayOpcion = false;
            document.getElementById('btn-lanzar').disabled = true;
            document.getElementById('btn-fallo').style.display = 'inline-block';

            card.lineas.forEach((l, idx) => {
                const el = document.getElementById(`l-${castilloObjetivo}-${idx}`);
                if (el.classList.contains('hecha')) return;

                let cumple = false;
                if (l.includes('⚔️')) {
                    const req = parseInt(l.replace('⚔️',''));
                    const totalInf = resultados.filter(d => d.tipo === 'inf').reduce((a,b) => a + b.val, 0);
                    if (totalInf >= req) cumple = true;
                } else if (resultados.some(d => d.txt === l)) {
                    cumple = true;
                }

                if (cumple) {
                    el.classList.add('disponible');
                    el.onclick = () => completarLinea(idx, l);
                    hayOpcion = true;
                }
            });

            document.getElementById('msg').innerText = hayOpcion ? "¡Éxito! Elige una línea para ocupar." : "Fallo en el asalto. Debes retirar un dado.";
        }

        function completarLinea(idx, texto) {
            // LÓGICA DE DADOS SOLICITADA: DESCONTAR SOLO LO NECESARIO [4]
            let dadosAUsar = 0;
            if (texto.includes('⚔️')) {
                const req = parseInt(texto.replace('⚔️',''));
                // Ordenar katanas de mayor a menor para usar la menor cantidad de dados posible
                const katanas = resultados.filter(d => d.tipo === 'inf').sort((a,b) => b.val - a.val);
                let suma = 0;
                for(let k of katanas) {
                    suma += k.val;
                    dadosAUsar++;
                    if (suma >= req) break;
                }
            } else {
                dadosAUsar = 1;
            }

            dadosBloqueados += dadosAUsar;
            const el = document.getElementById(`l-${castilloObjetivo}-${idx}`);
            el.classList.replace('disponible', 'hecha');
            el.onclick = null;

            // Limpiar otras opciones de esta tirada
            document.querySelectorAll('.linea.disponible').forEach(e => {
                e.classList.remove('disponible');
                e.onclick = null;
            });

            // Verificar si el castillo fue conquistado
            const restantes = document.querySelectorAll(`#lineas-${castilloObjetivo} .linea:not(.hecha)`);
            if (restantes.length === 0) {
                conquistar();
            } else {
                document.getElementById('btn-lanzar').disabled = false;
                document.getElementById('btn-fallo').style.display = 'none';
            }
            actualizarUI();
        }

        function penalizar() {
            dadosEnMano--;
            if (dadosEnMano <= dadosBloqueados) {
                alert("Asalto fallido. Has perdido todas tus tropas.");
                resetTurno();
            } else {
                lanzarDados();
            }
            actualizarUI();
        }

        function conquistar() {
            alert(`¡Has conquistado ${castillosOriginales[castilloObjetivo].nombre}!`);
            conquistados.push(castilloObjetivo);
            verificarClanes();
            resetTurno();
        }

        function verificarClanes() {
            const clanes = ["Mori", "Uesugi", "Chosokabe", "Shimazu", "Tokugawa", "Oda"];
            clanes.forEach(clan => {
                const totalIds = castillosOriginales.filter(c => c.clan === clan).map(c => c.id);
                if (totalIds.every(id => conquistados.includes(id)) && !clanesCompletos.includes(clan)) {
                    clanesCompletos.push(clan);
                    alert(`¡GRAN VICTORIA! El clan ${clan} ha sido unificado.`);
                }
            });
        }

        function resetTurno() {
            dadosEnMano = 7;
            dadosBloqueados = 0;
            castilloObjetivo = null;
            document.getElementById('btn-lanzar').disabled = true;
            document.getElementById('btn-fallo').style.display = 'none';
            document.getElementById('bandeja').innerHTML = '';
            renderMuro();
        }

        function actualizarUI() {
            document.getElementById('dados-contar').innerText = `Tropas disponibles: ${dadosEnMano - dadosBloqueados}`;
            
            // Cálculo de puntos [6, 7]
            let total = 0;
            const clanesProcesados = [];
            castillosOriginales.forEach(c => {
                if (conquistados.includes(c.id)) {
                    if (clanesCompletos.includes(c.clan)) {
                        if (!clanesProcesados.includes(c.clan)) {
                            total += c.unific; // Sumar valor de reverso [8]
                            clanesProcesados.push(c.clan);
                        }
                    } else {
                        total += c.pts;
                    }
                }
            });
            document.getElementById('puntos').innerText = total;
            document.getElementById('clanes-unificados').innerText = clanesCompletos.length > 0 ? "Clanes: " + clanesCompletos.join(", ") : "";
        }

        crearMuro(); renderMuro();
    </script>
</body>
</html>
