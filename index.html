<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Age of War - Prototipo V0.2 (Bloqueo de Dados)</title>
    <style>
        body { font-family: 'Arial', sans-serif; background: #1a1a1a; color: white; text-align: center; padding: 20px; }
        .escenario { display: flex; justify-content: center; gap: 40px; margin-top: 20px; }
        .carta { background: #fdfdfd; color: #333; padding: 20px; border-radius: 12px; width: 220px; border: 5px solid #8e44ad; box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
        .linea { border: 2px solid #ddd; margin: 8px 0; padding: 10px; border-radius: 6px; font-weight: bold; transition: 0.3s; cursor: default; position: relative; }
        .linea.disponible { border-color: #2ecc71; background: #e8f8f5; cursor: pointer; animation: pulse 1.5s infinite; }
        .linea.completada { background: #27ae60; color: white; text-decoration: line-through; border-color: #1e8449; }
        .marcador-dados { font-size: 1.2rem; color: #f1c40f; margin: 20px 0; }
        .bandeja { display: flex; justify-content: center; gap: 10px; min-height: 70px; margin: 20px; }
        .dado { width: 55px; height: 55px; background: white; color: black; display: flex; align-items: center; justify-content: center; border-radius: 8px; font-size: 1.4rem; border: 3px solid #333; }
        .dado.usado { opacity: 0.3; transform: scale(0.8); }
        button { padding: 12px 25px; font-size: 1rem; cursor: pointer; border-radius: 8px; border: none; background: #e67e22; color: white; font-weight: bold; }
        button:disabled { background: #555; cursor: not-allowed; }
        .rojo { background: #c0392b !important; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(46, 204, 113, 0.4); } 70% { box-shadow: 0 0 0 10px rgba(46, 204, 113, 0); } 100% { box-shadow: 0 0 0 0 rgba(46, 204, 113, 0); } }
    </style>
</head>
<body>

    <h1>Age of War: Fase de Asalto</h1>
    <div class="marcador-dados" id="info">Dados en mano: 7 | Dados bloqueados: 0</div>
    
    <div class="escenario">
        <div class="carta" id="castillo">
            <h2 style="margin:0">Kitanosho</h2>
            <p style="font-size: 0.8rem; color: #8e44ad;">CLAN UESUGI</p>
            <!-- Líneas de batalla según las fuentes -->
            <div class="linea" data-tipo="arquería" data-dados="1">🏹 Arquería</div>
            <div class="linea" data-tipo="caballería" data-dados="1">🐎 Caballería</div>
            <div class="linea" data-tipo="infantería" data-valor="6">⚔️ Infantería (6)</div>
            <div class="linea" data-tipo="daimyo" data-dados="1">👺 Daimyo</div>
        </div>
    </div>

    <div class="bandeja" id="bandeja">
        <!-- Aquí aparecen los dados lanzados -->
    </div>

    <div id="controles">
        <button id="btn-lanzar" onclick="lanzar()">Lanzar Dados</button>
        <button id="btn-fallar" class="rojo" onclick="penalizacion()" style="display:none">No puedo completar (Perder 1 dado)</button>
    </div>

    <p id="mensaje">Haz clic en "Lanzar Dados" para iniciar el ataque al castillo.</p>

    <script>
        const caras = [
            { texto: '⚔️1', valor: 1, tipo: 'infantería' },
            { texto: '⚔️2', valor: 2, tipo: 'infantería' },
            { texto: '⚔️3', valor: 3, tipo: 'infantería' },
            { texto: '🏹', valor: 1, tipo: 'arquería' },
            { texto: '🐎', valor: 1, tipo: 'caballería' },
            { texto: '👺', valor: 1, tipo: 'daimyo' }
        ];

        let dadosDisponibles = 7; // Dados totales que te quedan en el turno
        let dadosBloqueados = 0;   // Dados puestos sobre la carta
        let resultadosActuales = [];

        function lanzar() {
            const numALanzar = dadosDisponibles - dadosBloqueados;
            if (numALanzar <= 0) return finalizarTurno(false);

            resultadosActuales = [];
            const bandeja = document.getElementById('bandeja');
            bandeja.innerHTML = '';

            for (let i = 0; i < numALanzar; i++) {
                const cara = caras[Math.floor(Math.random() * caras.length)];
                resultadosActuales.push(cara);
                const d = document.createElement('div');
                d.className = 'dado';
                d.innerText = cara.texto;
                bandeja.appendChild(d);
            }

            document.getElementById('btn-lanzar').disabled = true;
            document.getElementById('btn-fallar').style.display = 'inline-block';
            verificarLineas();
        }

        function verificarLineas() {
            const lineas = document.querySelectorAll('.linea:not(.completada)');
            let opciones = 0;

            lineas.forEach(linea => {
                const tipo = linea.dataset.tipo;
                let cumple = false;

                if (tipo === 'infantería') {
                    const suma = resultadosActuales.filter(r => r.tipo === 'infantería').reduce((s, r) => s + r.valor, 0);
                    if (suma >= parseInt(linea.dataset.valor)) cumple = true;
                } else {
                    if (resultadosActuales.some(r => r.tipo === tipo)) cumple = true;
                }

                if (cumple) {
                    linea.classList.add('disponible');
                    linea.onclick = () => ocuparLinea(linea);
                    opciones++;
                }
            });

            document.getElementById('mensaje').innerText = opciones > 0 ? 
                "¡Ataque efectivo! Elige UNA línea para cubrirla." : 
                "No hay coincidencias. Debes sacrificar un dado para reintentar.";
        }

        function ocuparLinea(linea) {
            // Bloqueo de dados: Restamos los dados usados de la mano para el resto del turno [1, 2]
            let dadosUsadosEnEstaLinea = 0;
            const tipo = linea.dataset.tipo;

            if (tipo === 'infantería') {
                // En infantería se usan todos los dados de katanas que sumen el valor [4]
                dadosUsadosEnEstaLinea = resultadosActuales.filter(r => r.tipo === 'infantería').length;
            } else {
                dadosUsadosEnEstaLinea = 1;
            }

            dadosBloqueados += dadosUsadosEnEstaLinea;
            linea.classList.remove('disponible');
            linea.classList.add('completada');
            linea.onclick = null;

            // Limpiar otras líneas que se habían puesto brillantes
            document.querySelectorAll('.linea').forEach(l => {
                l.classList.remove('disponible');
                l.onclick = null;
            });

            actualizarMarcador();
            
            if (document.querySelectorAll('.linea:not(.completada)').length === 0) {
                finalizarTurno(true);
            } else {
                document.getElementById('btn-lanzar').disabled = false;
                document.getElementById('btn-fallar').style.display = 'none';
                document.getElementById('mensaje').innerText = "Línea cubierta. Lanza los dados restantes.";
            }
        }

        function penalizacion() {
            // Regla de asalto fallido: pierdes un dado y vuelves a tirar [1, 3]
            dadosDisponibles--; 
            actualizarMarcador();

            if (dadosDisponibles - dadosBloqueados <= 0) {
                finalizarTurno(false);
            } else {
                lanzar();
            }
        }

        function actualizarMarcador() {
            document.getElementById('info').innerText = 
                `Dados en mano: ${dadosDisponibles - dadosBloqueados} | Dados bloqueados: ${dadosBloqueados}`;
        }

        function finalizarTurno(ganado) {
            if (ganado) {
                alert("¡CASTILLO CONQUISTADO! Has unificado tus tropas.");
            } else {
                alert("ASALTO FALLIDO. Te has quedado sin tropas suficientes.");
            }
            location.reload();
        }
    </script>
</body>
</html>
