<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Age of War - Prototipo V0.1</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #2c3e50; color: white; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .muro { display: flex; gap: 20px; margin-bottom: 30px; }
        .carta { background: #ecf0f1; color: #333; padding: 15px; border-radius: 8px; width: 150px; text-align: center; border: 4px solid #8e44ad; position: relative; }
        .linea { border: 1px solid #bdc3c7; margin: 5px 0; padding: 5px; font-weight: bold; border-radius: 4px; background: #fff; }
        .linea.completada { background: #2ecc71; text-decoration: line-through; }
        .bandeja-dados { display: flex; gap: 10px; margin-top: 20px; min-height: 80px; }
        .dado { width: 60px; height: 60px; background: white; color: black; display: flex; align-items: center; justify-content: center; border-radius: 10px; font-size: 1.2rem; cursor: pointer; border: 2px solid #34495e; transition: transform 0.1s; }
        .dado.seleccionado { background: #3498db; color: white; transform: scale(0.9); }
        .controles { margin-top: 20px; }
        button { padding: 10px 20px; font-size: 1.1rem; cursor: pointer; border-radius: 5px; border: none; background: #e67e22; color: white; }
        button:disabled { background: #7f8c8d; }
        .mensaje { margin-top: 15px; font-style: italic; color: #f1c40f; }
    </style>
</head>
<body>

    <h1>Age of War - Prototipo</h1>
    
    <div class="muro">
        <!-- Carta de ejemplo: Kitanosho (Clan Uesugi) -->
        <div class="carta" id="castillo-1">
            <h3>Kitanosho</h3>
            <p>Puntos: 3</p>
            <div class="linea" data-tipo="arquería">🏹 Arqueros</div>
            <div class="linea" data-tipo="caballería">🐎 Caballería</div>
            <div class="linea" data-tipo="infantería" data-valor="6">⚔️ Infantería (6)</div>
        </div>
    </div>

    <div class="bandeja-dados" id="bandeja"></div>

    <div class="controles">
        <button id="btn-lanzar" onclick="lanzarDados()">Lanzar Ataque</button>
        <button id="btn-fallo" onclick="procesarFallo()" style="display:none; background:#c0392b;">No puedo completar, perder dado</button>
    </div>

    <div class="mensaje" id="log">Elige un castillo y lanza los dados para empezar.</div>

    <script>
        // Configuración de los símbolos de los dados según las fuentes [3]
        const caras = [
            { id: 'inf1', texto: '⚔️ 1', valor: 1, tipo: 'infantería' },
            { id: 'inf2', texto: '⚔️ 2', valor: 2, tipo: 'infantería' },
            { id: 'inf3', texto: '⚔️ 3', valor: 3, tipo: 'infantería' },
            { id: 'arq', texto: '🏹', valor: 1, tipo: 'arquería' },
            { id: 'cab', texto: '🐎', valor: 1, tipo: 'caballería' },
            { id: 'dai', texto: '👺', valor: 1, tipo: 'daimyo' }
        ];

        let dadosActivos = 7;
        let resultadosTurno = [];
        let lineasCompletadas = 0;

        function lanzarDados() {
            const bandeja = document.getElementById('bandeja');
            bandeja.innerHTML = '';
            resultadosTurno = [];
            
            // Animación mínima de vibración
            bandeja.style.transform = 'translateX(5px)';
            setTimeout(() => bandeja.style.transform = 'translateX(0)', 100);

            for (let i = 0; i < dadosActivos; i++) {
                const caraAleatoria = caras[Math.floor(Math.random() * caras.length)];
                resultadosTurno.push(caraAleatoria);
                
                const div = document.createElement('div');
                div.className = 'dado';
                div.innerText = caraAleatoria.texto;
                div.onclick = () => alert("En esta versión, las líneas se comprueban automáticamente.");
                bandeja.appendChild(div);
            }

            document.getElementById('btn-lanzar').disabled = true;
            document.getElementById('btn-fallo').style.display = 'inline-block';
            comprobarPosibilidades();
        }

        function comprobarPosibilidades() {
            // Lógica simplificada: El sistema busca si puedes completar una línea [2, 4]
            const lineas = document.querySelectorAll('.linea:not(.completada)');
            let puedeCompletar = false;

            lineas.forEach(linea => {
                const tipo = linea.dataset.tipo;
                const valorReq = parseInt(linea.dataset.valor) || 1;

                if (tipo === 'infantería') {
                    const totalInf = resultadosTurno
                        .filter(d => d.tipo === 'infantería')
                        .reduce((acc, d) => acc + d.valor, 0);
                    if (totalInf >= valorReq) habilitarLinea(linea);
                } else {
                    if (resultadosTurno.some(d => d.tipo === tipo)) habilitarLinea(linea);
                }
            });
        }

        function habilitarLinea(el) {
            el.style.cursor = 'pointer';
            el.style.border = '2px solid #2ecc71';
            el.onclick = () => completarLinea(el);
        }

        function completarLinea(el) {
            el.classList.add('completada');
            el.onclick = null;
            el.style.border = '1px solid #bdc3c7';
            
            // En el juego real, usarías los dados específicos [2]
            // Aquí simplificamos restando los dados disponibles para la siguiente tirada
            document.getElementById('log').innerText = "¡Línea completada! Vuelve a lanzar.";
            document.getElementById('btn-lanzar').disabled = false;
            document.getElementById('btn-fallo').style.display = 'none';
        }

        function procesarFallo() {
            if (dadosActivos > 1) {
                dadosActivos--; // Según reglas: pierde un dado y vuelve a tirar [1, 5]
                document.getElementById('log').innerText = `Fallaste el asalto. Pierdes 1 dado. Te quedan ${dadosActivos}.`;
                lanzarDados();
            } else {
                alert("Te has quedado sin dados. El turno termina.");
                location.reload();
            }
        }
    </script>
</body>
</html>
