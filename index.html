<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Age of War - Versión Multijugador 1.5</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #1a1a1a; color: white; display: flex; flex-direction: column; align-items: center; margin: 0; padding: 10px; }
        #setup-screen { background: #2c3e50; padding: 30px; border-radius: 15px; border: 4px solid #f1c40f; text-align: center; margin-top: 50px; }
        #game-screen { display: none; width: 98%; }
        #muro { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; padding-bottom: 220px; margin-top: 20px; }
        .carta { background: #fdfdfd; color: #111; padding: 8px; border-radius: 8px; border: 4px solid #888; cursor: pointer; transition: 0.2s; position: relative; min-height: 200px; }
        .carta.seleccionada { border-color: #f1c40f; box-shadow: 0 0 20px #f1c40f; transform: scale(1.02); z-index: 10; }
        .carta.inexpugnable { background: #333; color: #999; border-color: #27ae60; cursor: default; }
        .linea { border: 1px solid #ccc; margin: 3px 0; padding: 2px; border-radius: 4px; background: white; font-weight: bold; font-size: 0.8rem; text-align: center; }
        .linea.hecha { background: #27ae60; color: white; text-decoration: line-through; }
        .linea.resaltada { border: 2px solid #2ecc71; background: #d5f5e3; cursor: pointer; }
        .linea.daimyo-rojo { border: 2px solid #c0392b; color: #c0392b; background: #f9ebea; }
        
        .panel-inferior { position: fixed; bottom: 0; width: 100%; background: #222; border-top: 5px solid #f1c40f; padding: 15px; display: flex; justify-content: space-around; align-items: center; z-index: 100; }
        .bandeja-dados { display: flex; gap: 8px; min-width: 350px; justify-content: center; background: #333; padding: 10px; border-radius: 10px; }
        .dado { width: 45px; height: 45px; background: white; color: black; display: flex; align-items: center; justify-content: center; border-radius: 6px; font-size: 1.3rem; font-weight: bold; border: 2px solid #000; }
        
        .players-bar { position: fixed; top: 10px; left: 10px; display: flex; flex-direction: column; gap: 5px; }
        .player-tag { padding: 5px 15px; border-radius: 5px; font-weight: bold; border: 2px solid transparent; opacity: 0.6; }
        .player-tag.active { opacity: 1; border-color: white; transform: scale(1.1); box-shadow: 0 0 10px rgba(255,255,255,0.5); }
        
        button { padding: 10px 20px; font-size: 1rem; cursor: pointer; border-radius: 5px; border: none; background: #e67e22; color: white; font-weight: bold; margin: 5px; }
        button:disabled { background: #444; color: #777; cursor: not-allowed; }
    </style>
</head>
<body>

    <!-- Pantalla de Inicio -->
    <div id="setup-screen">
        <h1 style="color:#f1c40f">AGE OF WAR</h1>
        <p>Selecciona el número de Daimyos (2-6):</p>
        <div id="player-options">
            <button onclick="initGame(2)">2 Jugadores</button>
            <button onclick="initGame(3)">3 Jugadores</button>
            <button onclick="initGame(4)">4 Jugadores</button>
            <button onclick="initGame(5)">5 Jugadores</button>
            <button onclick="initGame(6)">6 Jugadores</button>
        </div>
        <hr>
        <button onclick="loadGame()" style="background:#27ae60">Continuar Partida Guardada</button>
    </div>

    <!-- Pantalla de Juego -->
    <div id="game-screen">
        <div class="players-bar" id="players-list"></div>
        <div style="text-align: right; width: 100%;">
            <button onclick="saveGame()" style="background:#2980b9; font-size:0.8rem">Guardar Partida</button>
        </div>
        <h2 id="turn-info" style="text-align:center; color:#f1c40f; margin:5px;">Turno de: Jugador 1</h2>
        <p id="feedback" style="text-align:center; font-size:0.9rem">Elige un castillo para iniciar el asalto.</p>
        <div id="muro"></div>
        <div class="panel-inferior">
            <div id="info-dados" style="font-size: 1rem; color: #f1c40f;">Tropas: 7</div>
            <div class="bandeja-dados" id="bandeja"></div>
            <div>
                <button id="btn-lanzar" onclick="lanzar()" disabled>LANZAR ATAQUE</button>
                <button id="btn-fallo" onclick="penalizar()" style="display:none; background:#c0392b;">FALLO (-1 DADO)</button>
            </div>
        </div>
    </div>

    <script>
        const castillosData = [
            { id: 0, clan: "Oda", nombre: "Kiyosu", color: "#d35400", lineas: ["🐎", "⚔️3"], pts: 2, unif: 18 },
            { id: 1, clan: "Oda", nombre: "Inabayama", color: "#d35400", lineas: ["🏹", "⚔️1"], pts: 1, unif: 18 },
            { id: 2, clan: "Oda", nombre: "Azuchi", color: "#d35400", lineas: ["🐎🐎", "⚔️5"], pts: 3, unif: 18 },
            { id: 3, clan: "Tokugawa", nombre: "Okazaki", color: "#444", lineas: ["⚔️7", "🏹"], pts: 2, unif: 18 },
            { id: 4, clan: "Tokugawa", nombre: "Hamamatsu", color: "#444", lineas: ["🏹🏹"], pts: 1, unif: 18 },
            { id: 5, clan: "Tokugawa", nombre: "Edo", color: "#444", lineas: ["⚔️3", "🏹", "🐎"], pts: 3, unif: 18 },
            { id: 6, clan: "Shimazu", nombre: "Uchijo", color: "#27ae60", lineas: ["🏹", "⚔️5", "⚔️2"], pts: 2, unif: 7 },
            { id: 7, clan: "Shimazu", nombre: "Kagoshima", color: "#27ae60", lineas: ["⚔️4"], pts: 3, unif: 7 },
            { id: 8, clan: "Chosokabe", nombre: "Oko", color: "#3498db", lineas: ["🐎"], pts: 1, unif: 5 },
            { id: 9, clan: "Chosokabe", nombre: "Urado", color: "#3498db", lineas: ["⚔️4", "⚔️4"], pts: 2, unif: 5 },
            { id: 10, clan: "Mori", nombre: "Yoshida-Koriyama", color: "#e74c3c", lineas: ["🏹", "⚔️5", "⚔️2"], pts: 2, unif: 10 },
            { id: 11, clan: "Mori", nombre: "Gassan-Toda", color: "#e74c3c", lineas: ["⚔️8"], pts: 2, unif: 10 },
            { id: 12, clan: "Uesugi", nombre: "Kasugayama", color: "#8e44ad", lineas: ["🏹🏹", "🐎🐎"], pts: 4, unif: 12 },
            { id: 13, clan: "Uesugi", nombre: "Otate", color: "#8e44ad", lineas: ["🏹🏹", "🐎", "⚔️6"], pts: 3, unif: 12 }
        ];

        const playerColors = ["#e74c3c", "#3498db", "#2ecc71", "#f1c40f", "#9b59b6", "#e67e22"];
        let state = {
            numPlayers: 0,
            turno: 0,
            players: [], // {id, score, cards:[]}
            conquistados: {}, // castleId: playerId
            unificados: [], // clan names
            dadosMano: 7,
            dadosEnCarta: 0,
            idSel: null,
            tirada: [],
            lineasHechas: []
        };

        function initGame(n) {
            state.numPlayers = n;
            for(let i=0; i<n; i++) state.players.push({ id: i, name: `Jugador ${i+1}`, score: 0, cards: [] });
            document.getElementById('setup-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'block';
            render();
        }

        function render() {
            const list = document.getElementById('players-list'); list.innerHTML = '';
            state.players.forEach((p, i) => {
                list.innerHTML += `<div class="player-tag ${state.turno === i ? 'active' : ''}" style="background:${playerColors[i]}">${p.name}: ${p.score} pts</div>`;
            });
            document.getElementById('turn-info').innerText = `Turno de: ${state.players[state.turno].name}`;

            const container = document.getElementById('muro'); container.innerHTML = '';
            castillosData.forEach(c => {
                const ownerId = state.conquistados[c.id];
                const esUnif = state.unificados.includes(c.clan);
                const div = document.createElement('div');
                div.className = `carta ${esUnif ? 'inexpugnable' : ''} ${state.idSel === c.id ? 'seleccionada' : ''}`;
                
                // Si alguien lo tiene, borde del color del jugador
                if(ownerId !== undefined) div.style.border = `6px solid ${playerColors[ownerId]}`;
                else div.style.borderColor = "#888";

                div.innerHTML = `<div style="font-size:0.6rem; color:${c.color}">${c.clan.toUpperCase()}</div>
                                 <strong>${c.nombre}</strong><div id="lines-${c.id}"></div>
                                 <div style="position:absolute; bottom:5px; left:5px; font-weight:bold;">PTS: ${c.pts}</div>`;
                
                // Mostrar líneas de batalla
                const linesDiv = div.querySelector(`#lines-${c.id}`);
                // Si no es del centro, añadir Daimyo Rojo
                if(ownerId !== undefined && ownerId !== state.turno && !esUnif) {
                    const lRed = document.createElement('div'); lRed.className = 'linea daimyo-rojo';
                    lRed.innerText = "👺 (ROBO)";
                    if(state.idSel === c.id && state.lineasHechas.includes("daimyo-robo")) lRed.classList.add('hecha');
                    linesDiv.appendChild(lRed);
                }

                c.lineas.forEach((l, i) => {
                    const lDiv = document.createElement('div'); lDiv.className = 'linea';
                    lDiv.id = `l-${c.id}-${i}`; lDiv.innerText = l;
                    if(state.idSel === c.id && state.lineasHechas.includes(i)) lDiv.classList.add('hecha');
                    linesDiv.appendChild(lDiv);
                });

                if (!esUnif && ownerId !== state.turno) div.onclick = () => select(c.id);
                container.appendChild(div);
            });
            document.getElementById('info-dados').innerText = `Tropas: ${state.dadosMano - state.dadosEnCarta}`;
        }

        function select(id) { if (state.dadosEnCarta > 0) return; state.idSel = id; state.lineasHechas = []; document.getElementById('btn-lanzar').disabled = false; render(); }

        function lanzar() {
            const num = state.dadosMano - state.dadosEnCarta; state.tirada = [];
            const tray = document.getElementById('bandeja'); tray.innerHTML = '';
            const caras = ["⚔️1", "⚔️2", "⚔️3", "🏹", "🐎", "👺"];
            for(let i=0; i<num; i++) {
                const r = caras[Math.floor(Math.random()*6)];
                state.tirada.push({ val: r.includes('⚔️') ? parseInt(r.replace('⚔️','')) : 1, tipo: r.includes('⚔️') ? 'inf' : r, txt: r });
                tray.innerHTML += `<div class="dado">${r}</div>`;
            }
            validar();
        }

        function validar() {
            const c = castillosData[state.idSel]; let hayAlgo = false;
            document.getElementById('btn-lanzar').disabled = true;
            document.getElementById('btn-fallo').style.display = 'inline-block';

            // Validar líneas normales
            c.lineas.forEach((l, i) => {
                if (state.lineasHechas.includes(i)) return;
                if (checkReq(l)) { habilitarLinea(i, l); hayAlgo = true; }
            });

            // Validar Daimyo de Robo
            if(state.conquistados[c.id] !== undefined && !state.lineasHechas.includes("daimyo-robo")) {
                if(state.tirada.some(d => d.txt === "👺")) {
                    const el = document.querySelector('.daimyo-rojo');
                    el.classList.add('resaltada');
                    el.onclick = () => ocupar("daimyo-robo", "👺");
                    hayAlgo = true;
                }
            }

            if (!hayAlgo) {
                document.getElementById('feedback').innerText = "Fallo. -1 dado.";
                checkDerrota();
            } else { document.getElementById('feedback').innerText = "¡Elige qué línea ocupar!"; }
        }

        function checkReq(l) {
            if (l.includes('⚔️')) {
                const req = parseInt(l.replace('⚔️',''));
                const sum = state.tirada.filter(d => d.tipo === 'inf').reduce((a,b) => a + b.val, 0);
                return sum >= req;
            } else {
                const reqSyms = [...l]; const disp = state.tirada.map(d => d.txt);
                return reqSyms.every(s => { const idx = disp.indexOf(s); if (idx > -1) { disp.splice(idx, 1); return true; } return false; });
            }
        }

        function habilitarLinea(idx, txt) {
            const el = document.getElementById(`l-${state.idSel}-${idx}`);
            el.classList.add('resaltada');
            el.onclick = () => ocupar(idx, txt);
        }

        function ocupar(idx, txt) {
            let usados = 0;
            if (txt.includes('⚔️')) {
                const req = parseInt(txt.replace('⚔️',''));
                const kats = state.tirada.filter(d => d.tipo === 'inf').sort((a,b) => b.val - a.val);
                let s = 0; for(let k of kats) { s += k.val; usados++; if (s >= req) break; }
            } else usados = [...txt].length;

            state.dadosEnCarta += usados;
            state.lineasHechas.push(idx);
            
            const reqTotales = castillosData[state.idSel].lineas.length + (state.conquistados[state.idSel] !== undefined ? 1 : 0);
            if (state.lineasHechas.length === reqTotales) conquistar();
            else {
                document.getElementById('btn-lanzar').disabled = false;
                document.getElementById('btn-fallo').style.display = 'none';
                render();
            }
        }

        function conquistar() {
            alert(`¡DAIMYO! ${state.players[state.turno].name} conquista ${castillosData[state.idSel].nombre}`);
            state.conquistados[state.idSel] = state.turno;
            verificarUnificacion();
            nextTurn();
        }

        function nextTurn() {
            state.turno = (state.turno + 1) % state.numPlayers;
            state.dadosMano = 7; state.dadosEnCarta = 0; state.idSel = null; state.lineasHechas = [];
            document.getElementById('btn-lanzar').disabled = true;
            document.getElementById('btn-fallo').style.display = 'none';
            document.getElementById('bandeja').innerHTML = '';
            render();
        }

        function penalizar() {
            state.dadosMano--;
            if (state.dadosMano <= state.dadosEnCarta) { alert("Asalto fallido. Pierdes el turno."); nextTurn(); }
            else lanzar();
        }

        function verificarUnificacion() {
            ["Oda", "Tokugawa", "Shimazu", "Chosokabe", "Mori", "Uesugi"].forEach(clan => {
                const ids = castillosData.filter(c => c.clan === clan).map(c => c.id);
                if (ids.every(id => state.conquistados[id] === state.turno) && !state.unificados.includes(clan)) {
                    state.unificados.push(clan);
                    alert(`¡${clan.toUpperCase()} UNIFICADO!`);
                }
            });
            updateScores();
        }

        function updateScores() {
            state.players.forEach(p => {
                let total = 0; const clansVistos = [];
                castillosData.forEach(c => {
                    if (state.conquistados[c.id] === p.id) {
                        if (state.unificados.includes(c.clan)) {
                            if (!clansVistos.includes(c.clan)) { total += c.unif; clansVistos.push(c.clan); }
                        } else total += c.pts;
                    }
                });
                p.score = total;
            });
        }

        function saveGame() {
            localStorage.setItem('ageOfWarSave', JSON.stringify(state));
            alert("Partida guardada en este navegador.");
        }

        function loadGame() {
            const saved = localStorage.getItem('ageOfWarSave');
            if (saved) {
                state = JSON.parse(saved);
                document.getElementById('setup-screen').style.display = 'none';
                document.getElementById('game-screen').style.display = 'block';
                render();
            } else alert("No hay partidas guardadas.");
        }
        
        function checkDerrota() {
             const dadosRestantes = (state.dadosMano - 1) - state.dadosEnCarta;
             if(dadosRestantes < 1) { alert("Sin dados suficientes. Turno perdido."); nextTurn(); }
        }
    </script>
</body>
</html>
